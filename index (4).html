<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kahuz!</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;800;900&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
<script src="/socket.io/socket.io.js"></script>
<style>
body{margin:0;min-height:100vh;color:#fff;font-family:Montserrat,system-ui,sans-serif;background:radial-gradient(circle at 50% -10%,#7c3aed,#4c1d95 45%,#2a0a66)}
.btn{display:flex;align-items:center;justify-content:center;gap:.6rem;width:100%;color:#fff;font-weight:800;font-size:1.2rem;padding:.85rem 1rem;border-radius:.5rem;border:0;border-bottom:6px solid rgba(0,0,0,.3);transition:.08s}
.btn:active{transform:translateY(4px);border-bottom-width:2px}
.c0{background:#e11d48}.c1{background:#2563eb}.c2{background:#d99a00}.c3{background:#16a34a}.go{background:#1f2937}
.shp svg{fill:#fff;width:1em;height:1em}
.btn.big{font-size:4.5rem;min-height:30vh}
.card{background:#fff;color:#1f1147;border-radius:.6rem;padding:1rem;border-bottom:5px solid rgba(0,0,0,.18)}
.inp{width:100%;border:2px solid #cbd5e1;border-radius:.5rem;padding:.75rem;margin-bottom:.6rem;font-size:1.1rem;text-align:center;font-weight:800;color:#1f1147}
.mascot{border-radius:50%;object-fit:cover;object-position:top;border:4px solid #fff;box-shadow:0 8px 20px rgba(0,0,0,.4);margin:auto}
.tile{border:3px solid transparent;border-radius:.8rem;line-height:0;background:none;padding:0}
.tile.on{border-color:#7c3aed}
.float{animation:fl 3s ease-in-out infinite}.jump{animation:jp .6s ease-out 3}.sad{animation:sd .6s 2}
@keyframes fl{50%{transform:translateY(-6px)}}
@keyframes jp{40%{transform:translateY(-30px) scale(1.12)}}
@keyframes sd{25%{transform:rotate(-12deg)}75%{transform:rotate(12deg)}}
.shake{animation:sk .45s}@keyframes sk{20%{transform:translateX(-14px)}60%{transform:translateX(14px)}}
.pop{animation:pp .45s ease-out both}@keyframes pp{from{opacity:0;transform:translateY(14px) scale(.92)}}
.tm{font-size:2.2rem;font-weight:900;background:#fff;color:#4c1d95;width:74px;height:74px;border-radius:50%;margin:6px auto;display:grid;place-items:center}
.tm.hot{background:#e11d48;color:#fff;animation:hb .5s infinite}@keyframes hb{50%{transform:scale(1.18)}}
.res{border-radius:.8rem;padding:2rem 1rem;min-height:70vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.8rem}
.ok{background:#16a34a}.no{background:#e11d48}.wait{background:#3b1a8c}
.step{background:#fff;color:#4c1d95;border-radius:.5rem .5rem 0 0;font-size:2.2rem;font-weight:900;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:.3rem}
.step small{font-size:.9rem}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}

const ORD = { neck: 0, face: 1, eyes: 2, head: 3 };
const pos = (i, c, r) => `${i % c / (c - 1) * 100}% ${Math.floor(i / c) / (r - 1) * 100}%`;
const av = (v, c = '', z = 72) => {
  const [a, k] = (v || '0|').split('|');
  const acc = (k ? k.split(',').map(Number) : []).filter((n) => ACS[n]).sort((x, y) => ORD[ACS[x][0]] - ORD[ACS[y][0]])
    .map((n) => { const [, cx, cy, w] = ACS[n]; return `<div class="sc ab" style="left:${cx - w / 2}%;top:${cy - w / 2}%;width:${w}%;height:${w}%;background-position:${pos(n, 4, 4)}"></div>`; }).join('');
  return `<div class="avw ${c}" style="width:${z}px;height:${z}px"><div class="sa" style="background-position:${pos(+a || 0, 7, 4)}"></div>${acc}</div>`;
};

const board = (t) => `<div class="card text-left space-y-2">${t.slice(0, 5).map((p, i) =>
  `<div class="flex items-center gap-3 pop" style="animation-delay:${i * .12}s"><b class="w-6 text-center text-lg">${i + 1}</b>${av(p.avatar, '', 40)}<b class="flex-1 truncate">${p.name}</b><b>${p.score}</b></div>`).join('')}</div>`;
const H = [170, 130, 100];
const podium = (t) => `<div class="flex items-end justify-center gap-2 mt-6">${[1, 0, 2].map((i) => t[i] ?
  `<div class="pop" style="animation-delay:${(2 - i) * .6}s;width:31%">${av(t[i].avatar, i === 0 ? 'float' : '', 72)}<div class="font-black truncate">${t[i].name}</div><div class="step" style="height:${H[i]}px">${i + 1}<small>${t[i].score}</small></div></div>` : '').join('')}</div>`;

function home() {
  role = null;
  set(`${mascot(110)}
  <div class="flex items-center justify-center gap-3 mt-3">${logo(60)}<h1 class="text-5xl font-black">Kahuz!</h1></div>
  <div class="card mt-5">
    <input id="pin" class="inp" placeholder="Game PIN" inputmode="numeric">
    <input id="nick" class="inp" placeholder="Ismingiz" maxlength="16" autocomplete="given-name">
    <div id="prev" class="my-2">${av(myAv(), '', 120)}</div>
    <div class="flex flex-wrap justify-center gap-1 mb-2">${Array.from({ length: NA }, (_, i) => `<button class="tile ${i === me.a ? 'on' : ''}" data-a="${i}" onclick="pickA(${i},this)">${av(i + '|', '', 44)}</button>`).join('')}</div>
    <div class="flex flex-wrap justify-center gap-1 mb-3">${ACS.map((x, i) => `<button class="tile acc ${me.k.includes(i) ? 'on' : ''}" onclick="pickK(${i},this)"><div class="sc" style="width:42px;height:42px;background-position:${pos(i, 4, 4)}"></div></button>`).join('')}</div>
    <button class="btn c3" onclick="join()">Kirish</button>
  </div>
  <button class="btn go mt-5" onclick="role='host';s.emit('create')">Ustoz sifatida boshlash</button>`);
}
function upd() { document.getElementById('prev').innerHTML = av(myAv(), 'jump', 120); }
function pickA(a, b) { me.a = a; document.querySelectorAll('[data-a]').forEach((x) => x.classList.remove('on')); b.classList.add('on'); upd(); }
function pickK(k, b) {
  const i = me.k.indexOf(k);
  if (i >= 0) me.k.splice(i, 1);
  else { me.k = me.k.filter((x) => ACS[x][0] !== ACS[k][0]); me.k.push(k); }
  document.querySelectorAll('.tile.acc').forEach((x, j) => x.classList.toggle('on', me.k.includes(j)));
  upd();
}
function join() {
  role = 'player'; me.name = nick.value.trim();
  s.emit('join', { pin: pin.value.trim(), name: me.name, avatar: myAv() });
}
function ans(i) {
  s.emit('answer', i);
  set(`${av(myAv(), 'float', 120)}<h2 class="text-2xl font-black">Javob qabul qilindi</h2><p class="opacity-80">Boshqalar javob berishini kuting…</p>`, 'res wait');
}
function lobby(l) {
  set(`${mascot(90)}<p class="font-bold mt-3 opacity-90">Kirish uchun PIN kod:</p>
  <div class="text-7xl font-black bg-white text-purple-900 rounded-xl py-3 my-3">${me.pin}</div>
  <div class="font-bold mb-3">O'yinchilar: ${l.length}</div>
  <div class="flex flex-wrap justify-center gap-3">${l.map((p) => `<div class="card pop">${av(p.avatar, 'float', 64)}<b>${p.name}</b></div>`).join('')}</div>
  ${l.length ? `<button class="btn c3 mt-5" onclick="s.emit('next')">Boshlash</button>` : '<p class="font-bold mt-5 opacity-80">O\'yinchilar kutilmoqda…</p>'}`);
}

s.on('created', (p) => { me.pin = p; lobby([]); });
s.on('lobby', (l) => { if (role === 'host') lobby(l); });
s.on('joined', () => set(`${av(myAv(), 'jump', 130)}<h2 class="text-3xl font-black mt-4">${me.name}</h2><p class="font-bold opacity-90">Siz o'yindasiz! Ustoz boshlashini kuting…</p>`, 'res wait'));
s.on('err', (m) => { alert(m); if (m.includes('Ustoz')) home(); });

s.on('question', (d) => {
  let t = d.t;
  if (role === 'host') {
    set(`<div class="flex justify-between items-center font-bold"><span>${d.n} / ${d.total}</span><span id="ac">0 javob</span></div>
    <div id="tm" class="tm">${t}</div>
    <div class="card text-2xl md:text-3xl font-black py-8">${d.q}</div>
    <div class="grid grid-cols-2 gap-3 mt-4">${d.a.map((x, i) => `<div class="btn c${i}"><span class="shp">${SH[i]}</span>${x}</div>`).join('')}</div>`);
  } else {
    set(`<div id="tm" class="tm">${t}</div><div class="grid grid-cols-2 gap-3 mt-3">${d.a.map((x, i) => `<button class="btn big c${i}" onclick="ans(${i})"><span class="shp">${SH[i]}</span></button>`).join('')}</div>`);
  }
  clearInterval(tm);
  tm = setInterval(() => {
    t--; const e = document.getElementById('tm');
    if (e) { e.textContent = Math.max(t, 0); if (t <= 5) e.classList.add('hot'); }
    if (t <= 0) clearInterval(tm);
  }, 1000);
});
s.on('answered', (n) => { const e = document.getElementById('ac'); if (e) e.textContent = n + ' javob'; });

s.on('result', (d) => {
  clearInterval(tm);
  set(`${av(myAv(), (d.correct ? 'jump' : 'sad'), 130)}<h2 class="text-4xl font-black">${d.correct ? "To'g'ri!" : "Noto'g'ri"}</h2>
  <div class="text-2xl font-extrabold">+${d.gain}</div><div class="font-bold opacity-90">Jami: ${d.score} ball</div>`, 'res ' + (d.correct ? 'ok' : 'no shake'));
  if (d.correct) confetti({ particleCount: 120, spread: 80, origin: { y: .6 } });
});

s.on('reveal', (d) => {
  clearInterval(tm);
  if (role !== 'host') return;
  const m = Math.max(...d.counts, 1);
  set(`<div class="flex items-end justify-center gap-3" style="height:170px">${d.counts.map((c, i) =>
    `<div class="c${i} w-20 rounded-t-lg font-black flex flex-col items-center justify-end pb-1 ${i === d.c ? 'ring-4 ring-white' : 'opacity-50'}" style="height:${18 + c / m * 82}%"><span class="shp text-2xl">${SH[i]}</span>${c}</div>`).join('')}</div>
  <div class="my-4">${board(d.top)}</div>
  <button class="btn go" onclick="s.emit('next')">${d.last ? 'Natijalar' : 'Keyingi savol'}</button>`);
});

s.on('over', (top) => {
  set(`<h2 class="text-4xl font-black mb-1">Natijalar</h2>${podium(top)}<button class="btn go mt-6" onclick="location.reload()">Qaytadan o'ynash</button>`);
  confetti({ particleCount: 220, spread: 120, origin: { y: .5 } });
});

home();
</script>
</body>
</html>
